<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘도 잘하고 있어요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafaf9; --ink:#1f2328; --soft:#7b8087; --line:#d9dbde; --accent:#2f5d62;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  :root:not([data-theme="light"]) { }
  *,*::before,*::after { box-sizing:inherit; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-weight:300; line-height:1.8; display:flex; justify-content:center; }
  main { width:100%; max-width:420px; padding:44px 24px 40px; display:flex; flex-direction:column; }
  .to { margin:0; color:var(--soft); font-size:.9rem; }
  h1 { margin:4px 0 0; font-family:"Noto Serif KR",serif; font-weight:600; font-size:1.6rem; line-height:1.4; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px 20px; margin:32px 0 0; border-bottom:1px solid var(--line); }
  .tab { font:inherit; font-weight:400; font-size:.95rem; color:var(--soft); background:none; border:0; border-bottom:2px solid transparent; padding:8px 0; margin-bottom:-1px; cursor:pointer; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .stage { display:flex; flex-direction:column; align-items:center; margin:40px 0 0; }
  .draw { width:112px; height:112px; border-radius:50%; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:400; font-size:1rem; cursor:pointer; transition:background-color .2s,color .2s; }
  .draw:hover,.draw:active { background:var(--ink); color:var(--bg); }
  .hint { margin:14px 0 0; color:var(--soft); font-size:.9rem; text-align:center; }
  .result { margin-top:36px; padding-top:28px; border-top:1px solid var(--line); animation:fade .5s ease; }
  .result[hidden] { display:none; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }
  .label { margin:0; color:var(--accent); font-size:.9rem; font-weight:500; }
  .main { margin:10px 0 0; font-family:"Noto Serif KR",serif; font-size:1.25rem; line-height:1.75; word-break:keep-all; }
  .sub { margin:10px 0 0; color:var(--soft); font-size:.9rem; }
  .link { display:inline-block; margin-top:16px; color:var(--accent); font-weight:500; text-underline-offset:4px; }
  .again { margin:18px 0 0; padding:0; font:inherit; font-size:.9rem; color:var(--soft); background:none; border:0; text-decoration:underline; text-underline-offset:4px; cursor:pointer; display:block; }
  footer { margin-top:auto; padding-top:48px; }
  .letter-btn { font:inherit; font-weight:400; font-size:.9rem; color:var(--ink); background:none; border:1px solid var(--line); border-radius:6px; padding:8px 16px; cursor:pointer; }
  .letter-btn[disabled] { color:var(--soft); cursor:default; }
  .count { margin:8px 0 0; font-size:.85rem; color:var(--soft); }
  dialog { border:0; border-radius:8px; padding:28px 26px 22px; max-width:min(380px,90vw); background:#fff; color:var(--ink); }
  dialog::backdrop { background:rgba(31,35,40,.4); }
  dialog p { white-space:pre-line; margin:0 0 18px; font-family:"Noto Serif KR",serif; word-break:keep-all; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <p class="to" id="to"></p>
  <h1 id="title"></h1>
  <div class="tabs" role="tablist" aria-label="뽑기 종류">
    <button class="tab" role="tab" data-tab="fortune" aria-selected="true">운세</button>
    <button class="tab" role="tab" data-tab="cheer" aria-selected="false">응원</button>
    <button class="tab" role="tab" data-tab="power" aria-selected="false">힘이 필요할 때</button>
    <button class="tab" role="tab" data-tab="comfort" aria-selected="false">위로가 필요할 때</button>
  </div>
  <section class="stage">
    <button class="draw" id="draw">뽑기</button>
    <p class="hint" id="hint"></p>
  </section>
  <section class="result" id="result" hidden aria-live="polite"></section>
  <footer>
    <button class="letter-btn" id="letterBtn">편지</button>
    <p class="count" id="count"></p>
  </footer>
</main>
<dialog id="letterDialog"><p id="letterText"></p><form method="dialog"><button class="letter-btn">닫기</button></form></dialog>
<script src="data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("lucky." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("lucky." + k, JSON.stringify(v)); } catch (e) {} }
};
const HINTS = { fortune: "오늘의 운세를 뽑아요", cheer: "응원 한마디를 뽑아요", power: "힘이 나는 노래를 골라요", comfort: "위로가 되는 노래를 골라요" };
let tab = "fortune";
$("title").textContent = CONFIG.title; $("to").textContent = CONFIG.to; document.title = CONFIG.title;

const today = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; };

function updateCount() {
  const left = CONFIG.letterUnlockAt - store.get("count", 0);
  $("letterBtn").disabled = left > 0;
  $("count").textContent = left > 0 ? left + "번 더 뽑으면 열려요" : "";
}
function again(label) { const b = el("button", "again", label); b.onclick = draw; return b; }

function render(kind, d, fresh) {
  const box = $("result"); box.replaceChildren();
  if (kind === "fortune") {
    const k = hash(today());
    box.append(el("p", "label", d[0]), el("p", "main", d[1]),
      el("p", "sub", "행운의 색 " + LUCKY_COLORS[k % LUCKY_COLORS.length] + " · 행운의 물건 " + LUCKY_ITEMS[(k >> 3) % LUCKY_ITEMS.length]));
    if (!fresh) box.append(el("p", "sub", "운세는 하루에 한 번이에요. 내일 또 만나요."));
  } else if (kind === "cheer") {
    box.append(el("p", "label", typeof d === "string" ? "오늘의 한마디" : "오늘의 명언"), el("p", "main", typeof d === "string" ? d : d.t));
    if (typeof d !== "string") box.append(el("p", "sub", d.by));
    box.append(again("한 번 더"));
  } else {
    box.append(el("p", "label", kind === "power" ? "힘이 필요할 때" : "위로가 필요할 때"), el("p", "main", d[0]), el("p", "sub", d[1]));
    const a = el("a", "link", "유튜브에서 듣기");
    a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(d[1] + " " + d[0]);
    a.target = "_blank"; a.rel = "noopener";
    box.append(a, again("다른 노래"));
  }
  box.hidden = false; box.style.animation = "none"; void box.offsetWidth; box.style.animation = "";
}

function draw() {
  let d, fresh = true;
  if (tab === "fortune") {
    const s = store.get("fortune", null);
    if (s && s.date === today()) { d = FORTUNES[s.i % FORTUNES.length]; fresh = false; }
    else { const i = hash(today()) % FORTUNES.length; store.set("fortune", { date: today(), i }); d = FORTUNES[i]; }
  } else d = pick({ cheer: CHEERS, power: SONGS_POWER, comfort: SONGS_COMFORT }[tab]);
  if (fresh) { store.set("count", store.get("count", 0) + 1); updateCount(); }
  render(tab, d, fresh);
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  $("hint").textContent = HINTS[tab]; $("result").hidden = true;
});
$("draw").onclick = draw;
$("letterBtn").onclick = () => { $("letterText").textContent = CONFIG.letter; $("letterDialog").showModal(); };
$("hint").textContent = HINTS.fortune; updateCount();
</script>
</body>
</html>
