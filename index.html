<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("lucky." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("lucky." + k, JSON.stringify(v)); } catch (e) {} }
};
const HINTS = { tarot: "카드를 눌러 오늘의 하루를 확인해요", power: "카드를 눌러 힘이 나는 노래를 골라요", comfort: "카드를 눌러 위로가 되는 노래를 골라요" };
const ROMAN = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
let tab = "tarot", busy = false;
$("title").textContent = CONFIG.title; $("to").textContent = CONFIG.to; document.title = CONFIG.title;

const today = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const dateLabel = () => { const d = new Date(); return d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate(); };
const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
function updateHint() {
  const s = store.get("tarot", null);
  $("hint").textContent = tab === "tarot" && s && s.date === today() ? "오늘의 카드는 이미 뽑았어요. 카드를 누르면 다시 볼 수 있어요" : HINTS[tab];
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function updateCount() {
  const left = CONFIG.letterUnlockAt - store.get("count", 0);
  $("letterBtn").disabled = left > 0;
  $("count").textContent = left > 0 ? left + "번 더 뽑으면 열려요" : "편지가 열렸어요 ✉️";
}

function fill(kind, d, fresh) {
  const f = $("front"); f.replaceChildren();
  const acts = el("div", "acts");
  const row = (...x) => { const r = el("div", "row"); r.append(...x); return r; };
  const c = el("p", "cheer"), by = el("p", "by");
  const setCheer = (q) => { c.textContent = typeof q === "string" ? q : q.t; by.textContent = typeof q === "string" ? "" : q.by; };
  setCheer(d.cheer);
  const home = el("button", "btn ghost", "돌아가기"); home.onclick = () => { $("scene").classList.remove("flipped"); updateHint(); };
  if (kind === "tarot") {
    f.append(el("p", "num", ROMAN[d.n]), el("p", "name", d.ko), el("p", "en", d.en), el("hr", "line"), el("p", "msg", d.msg), el("hr", "line"), c, by);
    const b = el("button", "btn", "응원 한 번 더"); b.onclick = () => setCheer(pick(CHEERS));
    acts.append(el("span", "date", dateLabel()), row(b, home));
  } else {
    f.append(el("p", "num", "오늘의 추천곡"), el("p", "name", d.s[0]), el("p", "en", d.s[1]), el("hr", "line"), c, by);
    const a = el("a", "btn fill", "유튜브에서 듣기");
    a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(d.s[1] + " " + d.s[0]);
    a.target = "_blank"; a.rel = "noopener";
    const b = el("button", "btn", "다른 추천곡"); b.onclick = () => draw();
    acts.append(a, row(b, home));
  }
  f.append(acts);
}

async function draw() {
  if (busy) return; busy = true;
  const scene = $("scene");
  if (scene.classList.contains("flipped")) { scene.classList.remove("flipped"); await wait(500); }
  scene.classList.add("shake"); await wait(500); scene.classList.remove("shake");
  let d, fresh = true;
  if (tab === "tarot") {
    const s = store.get("tarot", null);
    const i = hash(today()) % TAROT.length, c = hash(today() + "c") % CHEERS.length;
    if (s && s.date === today()) fresh = false; else store.set("tarot", { date: today() });
    d = { ...TAROT[i], cheer: CHEERS[c] };
  } else d = { s: pick(tab === "power" ? SONGS_POWER : SONGS_COMFORT), cheer: pick(CHEERS) };
  if (fresh) { store.set("count", store.get("count", 0) + 1); updateCount(); }
  fill(tab, d, fresh);
  scene.classList.add("flipped"); updateHint();
  busy = false;
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  updateHint(); $("scene").classList.remove("flipped");
});
$("back").onclick = draw;
$("back").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); draw(); } };
const closeLetter = () => { const d = $("letterDialog"); if (d.close) d.close(); else d.removeAttribute("open"); };
$("letterClose").onclick = closeLetter;
$("letterDialog").onclick = (e) => { if (e.target === e.currentTarget) closeLetter(); };
$("letterBtn").onclick = () => { $("letterText").textContent = pick(CONFIG.letters); $("letterDialog").showModal(); };
updateHint(); updateCount();
