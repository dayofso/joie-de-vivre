<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>작은 행운 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f6;
    --ink: #4a3640;
    --soft: #8c7580;
    --card: #ffffff;
    --accent: #f7a6ba;      /* 탭에 따라 바뀌는 색 */
    --accent-soft: #ffe3ea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  body[data-tab="fortune"] { --accent: #f7a6ba; --accent-soft: #ffe3ea; }
  body[data-tab="cheer"]   { --accent: #ffcf6e; --accent-soft: #fff0c9; }
  body[data-tab="song"]    { --accent: #a9d9c5; --accent-soft: #def3ea; }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
    transition: background-color .3s;
  }
  main { width: 100%; max-width: 420px; padding: 28px 20px 36px; display: flex; flex-direction: column; align-items: center; }

  h1 { font-family: "Jua", "Gowun Dodum", sans-serif; font-weight: 400; font-size: 1.9rem; margin: 4px 0 2px; text-align: center; }
  .to { margin: 0; color: var(--soft); font-size: .95rem; text-align: center; }

  /* 탭 */
  .tabs { display: flex; gap: 8px; margin: 22px 0 6px; padding: 5px; background: #fff; border-radius: 999px; box-shadow: 0 0 0 1.5px var(--accent-soft); }
  .tab { font: inherit; font-family: "Jua", sans-serif; font-size: 1rem; border: 0; background: transparent; color: var(--soft); padding: 8px 18px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* 캡슐 */
  .stage { margin-top: 18px; display: flex; flex-direction: column; align-items: center; }
  .capsule-btn { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .capsule { width: 150px; height: 175px; overflow: visible; }
  .capsule g { transform-box: fill-box; transform-origin: center; }
  .capsule .top, .capsule .bottom { transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
  .capsule .top-fill { fill: var(--accent); transition: fill .3s; }
  .capsule .bottom-fill { fill: #fff; stroke: var(--accent); stroke-width: 3; transition: stroke .3s; }
  .capsule-btn.shake .capsule { animation: shake .6s ease-in-out; }
  .capsule-btn.open .top { transform: translate(-6px, -38px) rotate(-22deg); }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); }
  }
  .hint { margin: 6px 0 0; color: var(--soft); font-size: .95rem; text-align: center; min-height: 1.7em; }

  /* 결과 카드 */
  .result { width: 100%; margin-top: 18px; padding: 22px 22px 20px; background: var(--card); border-radius: 26px; box-shadow: 0 0 0 2px var(--accent-soft); text-align: center; }
  .result[hidden] { display: none; }
  .result.pop { animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .badge { display: inline-block; font-family: "Jua", sans-serif; background: var(--accent-soft); padding: 2px 14px; border-radius: 999px; font-size: 1rem; }
  .result .main { font-size: 1.15rem; margin: 12px 0 6px; word-break: keep-all; }
  .result .sub { font-size: .95rem; color: var(--soft); margin: 0; word-break: keep-all; }
  .lucky { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .95rem; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .link { display: inline-block; margin-top: 14px; padding: 8px 20px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-family: "Jua", sans-serif; }
  .again { margin-top: 14px; font: inherit; font-size: .95rem; color: var(--soft); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

  /* 편지 */
  footer { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .letter-btn { font: inherit; font-family: "Jua", sans-serif; border: 0; background: var(--accent-soft); color: var(--ink); padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  .letter-btn[disabled] { opacity: .55; cursor: default; }
  .count { margin: 0; font-size: .85rem; color: var(--soft); }
  dialog { border: 0; border-radius: 26px; padding: 26px 24px 20px; max-width: min(380px, 90vw); background: #fff; color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
  dialog::backdrop { background: rgba(74, 54, 64, .35); }
  dialog p { white-space: pre-line; margin: 0 0 16px; word-break: keep-all; }
  dialog form { text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-tab="fortune">
<main>
  <p class="to" id="to"></p>
  <h1 id="title"></h1>

  <div class="tabs" role="tablist" aria-label="뽑기 종류">
    <button class="tab" role="tab" id="t-fortune" data-tab="fortune" aria-selected="true">운세</button>
    <button class="tab" role="tab" id="t-cheer" data-tab="cheer" aria-selected="false">응원</button>
    <button class="tab" role="tab" id="t-song" data-tab="song" aria-selected="false">노래</button>
  </div>

  <section class="stage" role="tabpanel" aria-live="polite">
    <button class="capsule-btn" id="capsule" aria-label="캡슐 뽑기">
      <svg class="capsule" viewBox="0 0 150 175" aria-hidden="true">
        <g class="bottom">
          <path class="bottom-fill" d="M20 95 A55 55 0 0 0 130 95 Z"/>
          <circle cx="56" cy="120" r="4" fill="#4a3640"/>
          <circle cx="94" cy="120" r="4" fill="#4a3640"/>
          <path d="M66 129 Q75 138 84 129" fill="none" stroke="#4a3640" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="42" cy="130" rx="7" ry="4.5" fill="#f7a6ba" opacity=".55"/>
          <ellipse cx="108" cy="130" rx="7" ry="4.5" fill="#f7a6ba" opacity=".55"/>
        </g>
        <g class="top">
          <path class="top-fill" d="M20 95 A55 55 0 0 1 130 95 Z"/>
          <ellipse cx="50" cy="68" rx="10" ry="6" fill="#fff" opacity=".5" transform="rotate(-30 50 68)"/>
        </g>
      </svg>
    </button>
    <p class="hint" id="hint"></p>
  </section>

  <section class="result" id="result" hidden></section>

  <footer>
    <button class="letter-btn" id="letterBtn">편지 열기</button>
    <p class="count" id="count"></p>
  </footer>
</main>

<dialog id="letterDialog">
  <p id="letterText"></p>
  <form method="dialog"><button class="letter-btn">닫기</button></form>
</dialog>

<script>
/* ============================================================
   여기만 고치면 돼요. (이름, 문구, 노래, 편지)
   ============================================================ */
const CONFIG = {
  title: "작은 행운 뽑기",
  to: "○○님에게",                 // 받는 사람 이름이나 애칭
  letterUnlockAt: 5,               // 몇 번 뽑으면 편지가 열릴지
  letter:
`○○님께,

여기에 직접 쓴 편지를 넣어 주세요.
(줄바꿈은 그대로 보여요.)

- 보내는 사람 드림`
};

// 운세: 하루에 하나씩 정해져요. (같은 날에는 다시 눌러도 같은 결과)
const FORTUNES = [
  { grade: "반짝 행운", text: "오늘은 처음 떠오른 생각이 정답에 가까워요. 믿고 가 보세요.", color: "#f7a6ba", lucky: "행운 컬러: 분홍" },
  { grade: "느긋한 행운", text: "서두르지 않아도 제때 도착해요. 숨 한 번 고르고 시작해요.", color: "#a9d9c5", lucky: "행운 컬러: 연두" },
  { grade: "대박 행운", text: "오늘의 당신은 평소보다 한 뼘 더 빛나요. 그대로 가면 돼요.", color: "#ffcf6e", lucky: "행운 컬러: 노랑" },
  { grade: "소소한 행운", text: "작은 기쁨을 하나 발견하게 될 거예요. 눈을 크게 떠 봐요.", color: "#b9c8f2", lucky: "행운 컬러: 하늘" },
  { grade: "포근한 행운", text: "곁에 응원하는 사람이 있다는 걸 오늘은 꼭 기억해요.", color: "#f2c4e0", lucky: "행운 컬러: 연보라" },
  { grade: "씩씩한 행운", text: "떨리는 건 잘하고 싶다는 마음이에요. 그 마음이면 충분해요.", color: "#ffb48a", lucky: "행운 컬러: 살구" },
  { grade: "반짝 행운", text: "오늘 하는 일은 생각보다 훨씬 잘 풀려요. 걱정은 내려놓아요.", color: "#f7a6ba", lucky: "행운 컬러: 분홍" },
  { grade: "든든한 행운", text: "지금까지 해온 시간이 오늘을 받쳐 줄 거예요.", color: "#a9d9c5", lucky: "행운 컬러: 민트" }
];

// 응원: 누를 때마다 랜덤
const CHEERS = [
  "잘하고 있어요. 정말로요.",
  "오늘 한 걸음만 가요. 그거면 충분해요.",
  "완벽하지 않아도 괜찮아요. 당신다운 게 제일 좋아요.",
  "긴장되는 건 진심이라는 증거예요.",
  "당신을 응원하는 사람이 어딘가에서 지금도 웃고 있어요.",
  "지나간 일은 잊고, 다음 장면만 생각해요.",
  "충분히 멋져요. 오늘도, 내일도.",
  "힘들 땐 잠깐 쉬어도 돼요. 쉬는 것도 실력이에요.",
  "당신이 만든 순간들은 누군가의 소중한 기억이 돼요.",
  "수고했어요. 오늘도 잘 해냈어요.",
  "겁나도 괜찮아요. 그래도 해내는 사람이 당신이에요.",
  "어떤 날이든 당신 편이 여기 있어요."
];

// 노래: 링크는 유튜브 검색으로 연결돼요. (원하는 곡으로 바꿔 주세요)
const SONGS = [
  { title: "좋은 날", artist: "아이유", mood: "기분 좋게 시작하고 싶을 때" },
  { title: "Happy", artist: "Pharrell Williams", mood: "그냥 웃고 싶을 때" },
  { title: "Don't Stop Me Now", artist: "Queen", mood: "힘이 필요할 때" },
  { title: "걱정말아요 그대", artist: "이적", mood: "마음이 무거울 때" },
  { title: "Don't Stop Believin'", artist: "Journey", mood: "한 번 더 힘내고 싶을 때" }
];
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("lucky." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("lucky." + k, JSON.stringify(v)); } catch (e) {} }
};

let tab = "fortune";
let busy = false;

$("title").textContent = CONFIG.title;
$("to").textContent = CONFIG.to;
document.title = CONFIG.title;

const HINTS = {
  fortune: "캡슐을 눌러 오늘의 운세를 뽑아요",
  cheer: "캡슐을 눌러 응원 한마디를 받아요",
  song: "캡슐을 눌러 오늘의 노래를 골라요"
};

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function hashStr(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function updateCount() {
  const n = store.get("count", 0);
  const left = CONFIG.letterUnlockAt - n;
  $("letterBtn").disabled = left > 0;
  $("letterBtn").textContent = left > 0 ? "비밀 편지" : "편지 열기";
  $("count").textContent = left > 0 ? left + "번 더 뽑으면 열려요" : "";
}

function render(kind, data, fresh) {
  const box = $("result");
  box.replaceChildren();
  if (kind === "fortune") {
    box.append(el("span", "badge", data.grade), el("p", "main", data.text));
    const lucky = el("span", "lucky");
    const dot = el("span", "dot"); dot.style.background = data.color;
    lucky.append(dot, document.createTextNode(data.lucky));
    box.append(lucky);
    if (!fresh) box.append(el("p", "sub", "오늘의 운세는 하루에 한 번이에요. 내일 또 만나요."));
  } else if (kind === "cheer") {
    box.append(el("span", "badge", "오늘의 한마디"), el("p", "main", data));
    const again = el("button", "again", "한 번 더 뽑기");
    again.addEventListener("click", () => draw());
    box.append(again);
  } else {
    box.append(el("span", "badge", data.mood), el("p", "main", data.title), el("p", "sub", data.artist));
    const a = el("a", "link", "들으러 가기");
    a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(data.artist + " " + data.title);
    a.target = "_blank"; a.rel = "noopener";
    const again = el("button", "again", "다른 노래 뽑기");
    again.addEventListener("click", () => draw());
    box.append(a, document.createElement("br"), again);
  }
  box.hidden = false;
  box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
}

function draw() {
  if (busy) return;
  busy = true;
  const cap = $("capsule");
  $("result").hidden = true;
  cap.classList.remove("open"); cap.classList.add("shake");
  setTimeout(() => {
    cap.classList.remove("shake"); cap.classList.add("open");
    let kind = tab, data, fresh = true;
    if (kind === "fortune") {
      const saved = store.get("fortune", null);
      if (saved && saved.date === today()) { data = FORTUNES[saved.i % FORTUNES.length]; fresh = false; }
      else {
        const i = hashStr(today()) % FORTUNES.length;
        store.set("fortune", { date: today(), i }); data = FORTUNES[i];
      }
    } else if (kind === "cheer") data = pick(CHEERS);
    else data = pick(SONGS);
    if (fresh) { store.set("count", store.get("count", 0) + 1); updateCount(); }
    render(kind, data, fresh);
    busy = false;
  }, 650);
}

function setTab(next) {
  tab = next;
  document.body.dataset.tab = next;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === next)));
  $("capsule").classList.remove("open", "shake");
  $("result").hidden = true;
  $("hint").textContent = HINTS[next];
}

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("capsule").addEventListener("click", draw);
$("letterBtn").addEventListener("click", () => {
  $("letterText").textContent = CONFIG.letter;
  $("letterDialog").showModal();
});

setTab("fortune");
updateCount();
</script>
</body>
</html>
